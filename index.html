<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perpustakaan MI Alma'arif 02</title>
    
    <link rel="icon" type="image/png" href="apple-touch-icon.png">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">

    <style>
        /* Mengatur background body agar sama dengan background PERLIM (Gelap/Hijau Tua) */
        body, html { 
            margin: 0; 
            padding: 0; 
            height: 100%; 
            overflow: hidden; 
            /* Warna dasar dari aplikasi PERLIM Anda */
            background-color: #04190f; 
        }
        iframe { 
            border: none; 
            width: 100%; 
            height: 100%; 
            /* Memberikan warna background yang sama pada iframe agar tidak ada "flash" putih saat loading */
            background-color: #04190f; 
        }
    </style>
</head>
<body>
    <!-- Tambahkan loading="lazy" agar iframe tidak membebani render awal -->
    <iframe src="https://script.google.com/macros/s/AKfycbx5fEOtQaLmcRT17bdMUle0dImvfvLimUYCdVatezsoV412YfdYz6I6Gq6q7cx2CFJfYA/exec" allow="geolocation" loading="lazy"></iframe>
</body>
</html>
